<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>WF-01 회원가입</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".45" stop-color="#1e293b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="960" height="560" fill="url(#bg)"/>
<rect x="0" y="0" width="960" height="56" rx="0" fill="#ffffff" fill-opacity=".05"/><text x="480" y="36" font-size="20" font-weight="800" fill="#a5b4fc" text-anchor="middle">cal-todo</text><rect x="280" y="90" width="400" height="400" rx="18" fill="#ffffff" filter="url(#sh)"/><text x="480" y="135" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle">회원가입</text><text x="310" y="170" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">이메일</text><rect x="310" y="178" width="340" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="322" y="202" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">user@example.com</text><text x="310" y="234" font-size="12" font-weight="600" fill="#ef4444" text-anchor="start">(오류 예시) 이미 사용 중인 이메일입니다</text><text x="310" y="254" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">비밀번호</text><rect x="310" y="262" width="340" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="322" y="286" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">비밀번호</text><text x="310" y="322" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">이름</text><rect x="310" y="330" width="340" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="322" y="354" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">이름</text><rect x="310" y="392" width="340" height="42" rx="10" fill="url(#btn)" /><text x="480.0" y="418.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">가입하기</text><text x="480" y="462" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">이미 계정이 있나요?  로그인</text><text x="40" y="530" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">가입 후 자동 로그인 안 함 · 비밀번호 정책은 범위 제외</text><text x="920" y="530" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">WF-01 · FR-01 · BR-01, BR-07 · S-01, E-01</text>
</svg>
