<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="'Segoe UI','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>WF-03 내 정보 수정</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".45" stop-color="#1e293b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="960" height="490" fill="url(#bg)"/>
<rect x="0" y="0" width="960" height="56" rx="0" fill="#ffffff" fill-opacity=".05"/><line x1="0" y1="56" x2="960" y2="56" stroke="#ffffff" stroke-opacity=".08"/><text x="40" y="35" font-size="20" font-weight="800" fill="#a5b4fc" text-anchor="start">cal-todo</text><text x="150" y="35" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">할일</text><text x="220" y="35" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">카테고리</text><text x="310" y="35" font-size="14" font-weight="700" fill="#e0e7ff" text-anchor="start">내 정보</text><text x="920" y="35" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="end">로그아웃</text><rect x="40" y="90" width="880" height="330" rx="18" fill="#ffffff" filter="url(#sh)"/><text x="72" y="140" font-size="20" font-weight="800" fill="#0f172a" text-anchor="start">내 정보 수정</text><text x="72" y="190" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">이메일</text><text x="72" y="216" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">user-a@example.com</text><text x="300" y="216" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">(수정 불가)</text><text x="72" y="246" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">이름</text><rect x="72" y="254" width="360" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="84" y="278" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">사용자A</text><text x="72" y="326" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">(수정 항목은 이름만)</text><rect x="700" y="350" width="90" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="745.0" y="375.0" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">취소</text><rect x="806" y="350" width="90" height="40" rx="10" fill="url(#btn)" /><text x="851.0" y="375.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">저장</text><text x="40" y="460" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">본인 정보만 수정 (BR-01)</text><text x="920" y="460" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">WF-03 · FR-02 · BR-01 · S-03</text>
