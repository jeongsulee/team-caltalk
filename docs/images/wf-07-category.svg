<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>WF-07 카테고리 관리</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".45" stop-color="#1e293b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="960" height="560" fill="url(#bg)"/>
<rect x="0" y="0" width="960" height="56" rx="0" fill="#ffffff" fill-opacity=".05"/><line x1="0" y1="56" x2="960" y2="56" stroke="#ffffff" stroke-opacity=".08"/><text x="40" y="35" font-size="20" font-weight="800" fill="#a5b4fc" text-anchor="start">cal-todo</text><text x="150" y="35" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">할일</text><text x="220" y="35" font-size="14" font-weight="700" fill="#e0e7ff" text-anchor="start">카테고리</text><text x="310" y="35" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">내 정보</text><text x="920" y="35" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="end">로그아웃</text><rect x="40" y="90" width="880" height="410" rx="18" fill="#ffffff" filter="url(#sh)"/><text x="72" y="140" font-size="20" font-weight="800" fill="#0f172a" text-anchor="start">카테고리 관리</text><rect x="72" y="166" width="360" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="84" y="190" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">새 카테고리 이름</text><rect x="444" y="166" width="80" height="38" rx="10" fill="url(#btn)" /><text x="484.0" y="190.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">추가</text><text x="72" y="224" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">빈 이름·중복 이름은 오류 표시</text><rect x="72" y="240" width="816" height="168" rx="12" fill="#f8fafc" stroke="#e2e8f0" /><text x="92" y="274" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">기본</text><text x="200" y="274" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">('기본'은 수정·삭제 불가)</text><line x1="72" y1="296" x2="888" y2="296" stroke="#e2e8f0"/><text x="92" y="330" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">업무</text><rect x="720" y="309" width="72" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="756" y="329" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">수정</text><rect x="802" y="309" width="72" height="30" rx="8" fill="#ffffff" stroke="#fca5a5" /><text x="838" y="329" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">삭제</text><line x1="72" y1="352" x2="888" y2="352" stroke="#e2e8f0"/><text x="92" y="386" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">개인</text><rect x="720" y="365" width="72" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="756" y="385" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">수정</text><rect x="802" y="365" width="72" height="30" rx="8" fill="#ffffff" stroke="#fca5a5" /><text x="838" y="385" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">삭제</text><text x="72" y="442" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">수정 시: 이름이 입력창으로 바뀜</text><rect x="72" y="452" width="300" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" /><text x="84" y="474" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">업무</text><rect x="384" y="452" width="72" height="34" rx="10" fill="url(#btn)" /><text x="420.0" y="474.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">저장</text><rect x="464" y="452" width="72" height="34" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="500.0" y="474.0" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">취소</text><text x="40" y="536" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">삭제 전 확인창 1회 · 삭제 시 소속 할일은 &#x27;기본&#x27;으로 변경 (BR-09)</text><text x="920" y="536" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">WF-07 · FR-08 · BR-01, BR-03, BR-09~BR-11 · S-09, E-09, E-10</text>
</svg>
